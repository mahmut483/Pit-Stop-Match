<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8ec9f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pit Stop Match">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Pit Stop Match: tidy up the auto shop. Tap three of a kind, put every part back and fix the shop.">
<title>Pit Stop Match</title>
<!--ICONS-->
<script>
// Konsol hataları "errors-out" öğesine de yazılır (headless test okur).
window.__errors = [];
(function () {
  function put(msg) {
    window.__errors.push(String(msg));
    var el = document.getElementById("errors-out");
    if (!el && document.body) { el = document.createElement("pre"); el.id = "errors-out"; el.hidden = true; document.body.appendChild(el); }
    if (el) el.textContent = JSON.stringify(window.__errors);
  }
  window.addEventListener("error", function (e) { put((e.message || "error") + " @" + (e.filename || "") + ":" + (e.lineno || 0)); });
  window.addEventListener("unhandledrejection", function (e) { put("unhandledrejection: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
  var ce = console.error;
  console.error = function () { put([].map.call(arguments, function (a) { return a && a.stack || String(a); }).join(" ")); return ce.apply(console, arguments); };
})();
</script>
<style>
:root {
  --vh: 100vh;
  --w: min(100vw, calc(var(--vh) * 9 / 16));
  --u: calc(var(--w) / 390);
  --navy: #24407f;
  --navy-soft: #4c64a0;
  --teal: #3f8f98;
  --cream: #f8e9cf;
  --cream-hi: #fff6e6;
  --cream-rim: #e3c79e;
  --cream-shadow: #c9a674;
  --plate-blue: #2f5fc4;
  /* flat backdrop, dark enough to separate the (faded) shop from the screen */
  --bg: #1f2940;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  font-family: "Arial Rounded MT Bold", "Nunito", "Varela Round", "Trebuchet MS", system-ui, sans-serif;
  font-weight: 900;
  color: var(--navy);
}
@supports (height: 100dvh) { :root { --vh: 100dvh; } }
@media (max-aspect-ratio: 9/16) { :root { --w: 100vw; } }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e4e7ee; touch-action: none; overscroll-behavior: none; }
body { display: flex; justify-content: center; align-items: center; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; border: 0; padding: 0; background: none; }
[hidden] { display: none !important; }

/* Katmanlar: gökyüzü 0 · oda 1 · referans 2 · dokunma 3 · arayüz 4 · tepsi eşyaları 5 · ipuçları 6 · kartlar 8 · panel 9 · kepenk 10 */
/* on wide screens the phone-shaped game column sits on a light page, so its navy reads as the screen */
#game { position: relative; width: var(--w); height: var(--vh); overflow: hidden; isolation: isolate; background: var(--bg); box-shadow: 0 0 40px rgba(20, 28, 48, .28); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.sky { position: absolute; inset: 0; z-index: 0; background: var(--bg); }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; pointer-events: none; outline: none; }
#hit { position: absolute; inset: 0; z-index: 3; touch-action: none; }
#dock { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 5; pointer-events: none; }

/* ── Üst çubuk ── */
.round-btn { width: calc(var(--u) * 46); height: calc(var(--u) * 46); border-radius: 50%; display: grid; place-items: center; flex: none; transition: transform .12s;
  background: linear-gradient(180deg, var(--cream-hi), var(--cream)); box-shadow: 0 calc(var(--u) * 4) 0 var(--cream-shadow), 0 calc(var(--u) * 7) calc(var(--u) * 12) rgba(40, 60, 120, .22), inset 0 0 0 calc(var(--u) * 2) var(--cream-rim); }
.round-btn svg { width: 52%; height: 52%; }
.round-btn:active { transform: translateY(calc(var(--u) * 3)); box-shadow: 0 calc(var(--u) * 1) 0 var(--cream-shadow), inset 0 0 0 calc(var(--u) * 2) var(--cream-rim); }

/* ── İlerleme ── */
.progress { position: absolute; z-index: 4; top: calc(var(--safe-t) + 10%); left: calc(var(--u) * 40); right: calc(var(--u) * 40); height: calc(var(--u) * 24); }
.progress-track { position: absolute; inset: 0; border-radius: 999px; background: var(--cream); box-shadow: inset 0 0 0 calc(var(--u) * 2) var(--cream-rim), inset 0 calc(var(--u) * 3) calc(var(--u) * 4) rgba(160, 120, 70, .25), 0 calc(var(--u) * 3) 0 var(--cream-shadow); overflow: hidden; padding: calc(var(--u) * 4); }
#progress-fill { position: relative; display: block; height: 100%; width: 0; border-radius: 999px; overflow: hidden; background: linear-gradient(180deg, #8fe089, #4cbf62); box-shadow: inset 0 calc(var(--u) * -3) 0 rgba(0,0,0,.08), inset 0 calc(var(--u) * 2) 0 rgba(255,255,255,.45); transition: width .6s cubic-bezier(.3,1.3,.5,1); }
#progress-fill::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-20deg); }
#progress-fill.shine::after { animation: shine .9s ease-out; }
@keyframes shine { to { left: 130%; } }
#progress-caption { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--u) * 13); color: var(--navy); letter-spacing: .04em; }
.progress.bump { animation: bump .4s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump { 40% { transform: scale(1.05); } }

/* ── Döndür ipucu ── */

/* ── Alt: tepsi + yardımcılar ── */
.play-footer { position: absolute; z-index: 4; left: 0; right: 0; bottom: calc(var(--safe-b) + 10%); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 16); pointer-events: none; }
.play-footer > * { pointer-events: auto; }
.tray-frame { width: calc(var(--u) * 366); padding: calc(var(--u) * 8); border-radius: calc(var(--u) * 18); position: relative; transition: box-shadow .3s;
  background: linear-gradient(180deg, var(--cream-hi), var(--cream)); box-shadow: inset 0 0 0 calc(var(--u) * 2.5) var(--cream-rim), 0 calc(var(--u) * 5) 0 var(--cream-shadow), 0 calc(var(--u) * 10) calc(var(--u) * 18) rgba(40, 60, 120, .25); }
.tray-frame.warn { box-shadow: inset 0 0 0 calc(var(--u) * 2.5) #f2b45c, 0 calc(var(--u) * 5) 0 var(--cream-shadow), 0 0 calc(var(--u) * 18) rgba(246, 165, 96, .65); }
.tray-frame.danger { animation: danger 0.9s ease-in-out infinite; }
@keyframes danger { 0%, 100% { box-shadow: inset 0 0 0 calc(var(--u) * 3) #ef7f72, 0 calc(var(--u) * 5) 0 var(--cream-shadow), 0 0 calc(var(--u) * 12) rgba(239, 127, 114, .5); } 50% { box-shadow: inset 0 0 0 calc(var(--u) * 3) #e2554a, 0 calc(var(--u) * 5) 0 var(--cream-shadow), 0 0 calc(var(--u) * 26) rgba(239, 90, 80, .85); } }
#tray { display: grid; grid-template-columns: repeat(7, 1fr); gap: calc(var(--u) * 5); }
.slot { aspect-ratio: 1; border-radius: calc(var(--u) * 10); background: #efdcbc; box-shadow: inset 0 calc(var(--u) * 3) calc(var(--u) * 4) rgba(150, 110, 60, .28), inset 0 0 0 calc(var(--u) * 1.5) #dcc29a; transition: background .25s; }
.slot.glow { animation: slotGlow .45s ease-out; }
@keyframes slotGlow { 0% { background: #fff6d6; box-shadow: inset 0 0 0 calc(var(--u) * 2.5) #f6cf5c, 0 0 calc(var(--u) * 14) rgba(255, 220, 120, .9); } 100% { background: #efdcbc; } }
.slot.match { animation: slotMatch .55s ease-out; }
@keyframes slotMatch { 0% { background: #d9f7d2; box-shadow: inset 0 0 0 calc(var(--u) * 3) #6ccf6e, 0 0 calc(var(--u) * 18) rgba(110, 210, 110, .9); } 100% { background: #efdcbc; } }
@keyframes used { 30% { transform: scale(.88); } 65% { transform: scale(1.1); } }
.badge { position: absolute; right: calc(var(--u) * -4); top: calc(var(--u) * -4); min-width: calc(var(--u) * 24); height: calc(var(--u) * 24); padding: 0 calc(var(--u) * 5); border-radius: 999px; display: grid; place-items: center;
  background: var(--cream-hi); color: var(--navy); font-size: calc(var(--u) * 13); box-shadow: inset 0 0 0 calc(var(--u) * 2) var(--cream-rim), 0 calc(var(--u) * 2) 0 var(--cream-shadow); }
.badge.pop { animation: popIn .4s cubic-bezier(.3,1.8,.5,1); }
.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); } }
@keyframes popIn { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* ── Combo yazısı ── */
#combo { position: absolute; z-index: 6; left: 0; right: 0; bottom: calc(var(--safe-b) + 10% + var(--u) * 214); display: flex; justify-content: center; pointer-events: none; }
#combo span { display: inline-block; padding: calc(var(--u) * 6) calc(var(--u) * 18); border-radius: 999px; font-size: calc(var(--u) * 26); color: #fff; letter-spacing: .03em;
  background: linear-gradient(180deg, #ffb35c, #ef7f72); box-shadow: 0 calc(var(--u) * 4) 0 #c95b52, 0 calc(var(--u) * 10) calc(var(--u) * 20) rgba(201, 91, 82, .35); text-shadow: 0 2px 0 rgba(0,0,0,.15);
  animation: combo 1.25s cubic-bezier(.2,1.4,.4,1) forwards; }
#combo span small { font-size: .6em; margin-left: .3em; opacity: .9; }
@keyframes combo { 0% { transform: scale(.3) rotate(-8deg); opacity: 0; } 18% { transform: scale(1.12) rotate(2deg); opacity: 1; } 30% { transform: scale(1) rotate(0); } 75% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(calc(var(--u) * -40)); opacity: 0; } }

/* ── Sonuç kartı + seviye sayfası ── */
.backdrop { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(36, 52, 110, .38); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .25s ease-out; }
@keyframes fade { from { opacity: 0; } }
.card { width: calc(var(--u) * 316); padding: calc(var(--u) * 64) calc(var(--u) * 24) calc(var(--u) * 24); border-radius: calc(var(--u) * 28); position: relative; text-align: center;
  background: linear-gradient(180deg, var(--cream-hi), var(--cream)); box-shadow: inset 0 0 0 calc(var(--u) * 3) var(--cream-rim), 0 calc(var(--u) * 7) 0 var(--cream-shadow), 0 calc(var(--u) * 20) calc(var(--u) * 40) rgba(20, 30, 80, .35);
  animation: pop .5s cubic-bezier(.3,1.5,.5,1); }
@keyframes pop { from { transform: scale(.6) translateY(calc(var(--u) * 30)); opacity: 0; } }
.result-badge { position: absolute; left: 50%; top: calc(var(--u) * -46); transform: translateX(-50%); width: calc(var(--u) * 92); height: calc(var(--u) * 92); border-radius: 50%; display: grid; place-items: center;
  font-size: calc(var(--u) * 44); color: #fff; background: radial-gradient(circle at 50% 30%, #ffb3a1, #ef7f72 70%); box-shadow: 0 calc(var(--u) * 5) 0 #c95b52, inset 0 0 0 calc(var(--u) * 5) rgba(255,255,255,.35); z-index: 1; }
.result-badge svg { width: 50%; height: 50%; animation: wiggle 1.6s ease-in-out .5s infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-14deg); } 30% { transform: rotate(10deg); } 45% { transform: rotate(0); } }
.rays { position: absolute; left: 50%; top: calc(var(--u) * -100); width: calc(var(--u) * 200); height: calc(var(--u) * 200); margin-left: calc(var(--u) * -100); border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(rgba(255, 236, 160, .55) 0 10deg, transparent 10deg 24deg); -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%); mask: radial-gradient(circle, #000 25%, transparent 70%); animation: spin 9s linear infinite; display: none; }
#result.won .rays { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
#result.won .result-badge { background: radial-gradient(circle at 50% 30%, #a8f0a4, #4cbf62 70%); box-shadow: 0 calc(var(--u) * 5) 0 #36964b, inset 0 0 0 calc(var(--u) * 5) rgba(255,255,255,.35); }
.stars { display: flex; justify-content: center; gap: calc(var(--u) * 6); margin: calc(var(--u) * -6) 0 calc(var(--u) * 8); }
#result:not(.won) .stars, #result:not(.won) .stats { display: none; }
.stars svg { width: calc(var(--u) * 44); height: calc(var(--u) * 44); transform: scale(0); }
.stars svg:nth-child(2) { width: calc(var(--u) * 54); height: calc(var(--u) * 54); margin-top: calc(var(--u) * -10); }
.stars svg.in { animation: starIn .5s cubic-bezier(.3,1.8,.5,1) forwards; }
.stars svg path { fill: #e6d4b4; stroke: #c9a674; stroke-width: 1.5; stroke-linejoin: round; }
.stars svg.lit path { fill: #ffd34e; stroke: #e0a21f; }
@keyframes starIn { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
.stats { display: flex; justify-content: center; gap: calc(var(--u) * 8); margin: 0 0 calc(var(--u) * 6); }
.stats span { padding: calc(var(--u) * 5) calc(var(--u) * 10); border-radius: 999px; background: #f1dfbf; font-size: calc(var(--u) * 12.5); color: var(--navy-soft); box-shadow: inset 0 0 0 calc(var(--u) * 1.5) var(--cream-rim); }
.card h2 { margin: 0 0 calc(var(--u) * 6); font-size: calc(var(--u) * 32); letter-spacing: .02em; }
.card p { margin: 0 0 calc(var(--u) * 16); font-size: calc(var(--u) * 15); color: var(--navy-soft); line-height: 1.35; }
.big-btn { display: block; width: 100%; height: calc(var(--u) * 54); border-radius: calc(var(--u) * 16); font-size: calc(var(--u) * 19); letter-spacing: .03em; margin-top: calc(var(--u) * 10); transition: transform .12s; }
.big-btn.green { color: #fff; background: linear-gradient(180deg, #8fe089, #4cbf62); box-shadow: 0 calc(var(--u) * 5) 0 #36964b, inset 0 calc(var(--u) * 3) 0 rgba(255,255,255,.35); text-shadow: 0 2px 0 rgba(0,0,0,.12); }
.big-btn.green.breathe { animation: breathe 1.6s ease-in-out 1s infinite; }
@keyframes breathe { 50% { transform: scale(1.04); } }
.big-btn:active { transform: translateY(calc(var(--u) * 3)); }

/* ── Açılış ve bölüm geçişi: kepenk ── */
#loading { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; transition: transform .8s cubic-bezier(.6,0,.3,1);
  background: repeating-linear-gradient(180deg, #c2cede 0 calc(var(--u) * 22), #b0bfd4 calc(var(--u) * 22) calc(var(--u) * 24), #b8c6da calc(var(--u) * 24) calc(var(--u) * 44), #a6b5cc calc(var(--u) * 44) calc(var(--u) * 46)); }
#loading::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u) * 26); background: #94a7c4; box-shadow: inset 0 calc(var(--u) * 4) 0 rgba(255,255,255,.25); }
#loading.open { transform: translateY(-104%); }
.load-sign { padding: calc(var(--u) * 16) calc(var(--u) * 26); border-radius: calc(var(--u) * 18); background: #fbe39a; box-shadow: inset 0 0 0 calc(var(--u) * 5) #ef8a74, 0 calc(var(--u) * 6) 0 rgba(36, 64, 127, .25); text-align: center; }
.load-sign b { display: block; font-size: calc(var(--u) * 30); letter-spacing: .05em; }
#loading-message { margin: calc(var(--u) * 6) 0 0; font-size: calc(var(--u) * 14); color: var(--navy-soft); }
.load-bar { width: calc(var(--u) * 150); height: calc(var(--u) * 8); margin: calc(var(--u) * 10) auto 0; border-radius: 999px; background: rgba(36, 64, 127, .15); overflow: hidden; }
/* fills left to right while the shutter is down (restarted on every level change), full when it opens */
.load-bar i { display: block; height: 100%; width: 100%; border-radius: 999px; background: var(--navy); transform-origin: left center; animation: loadfill .85s cubic-bezier(.3,.7,.35,1) both; }
@keyframes loadfill { from { transform: scaleX(0.04); } to { transform: scaleX(1); } }

/* ── Eğitim eli ── */
#tutorial { position: absolute; left: 0; top: 0; z-index: 6; pointer-events: none; transition: opacity .3s; will-change: transform; }
.tut-hand { position: absolute; left: calc(var(--u) * -6); top: calc(var(--u) * 2); width: calc(var(--u) * 46); height: calc(var(--u) * 46); animation: tap 1.1s ease-in-out infinite; filter: drop-shadow(0 calc(var(--u) * 3) calc(var(--u) * 3) rgba(36, 64, 127, .3)); }
.tut-bubble { position: absolute; left: calc(var(--u) * -78); top: calc(var(--u) * -66); width: calc(var(--u) * 156); text-align: center; padding: calc(var(--u) * 7) calc(var(--u) * 10); border-radius: calc(var(--u) * 14); background: var(--cream-hi); font-size: calc(var(--u) * 13); box-shadow: inset 0 0 0 calc(var(--u) * 2) var(--cream-rim), 0 calc(var(--u) * 3) 0 var(--cream-shadow); }
@keyframes tap { 0%, 100% { transform: translate(0, 0) scale(1); } 45% { transform: translate(calc(var(--u) * -3), calc(var(--u) * -6)) scale(1.05); } 60% { transform: translate(0, 0) scale(.92); } }
.fps { position: absolute; z-index: 9; left: 6px; bottom: 6px; font: 600 11px/1 ui-monospace, monospace; color: #fff; background: rgba(0,0,0,.4); padding: 4px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main id="game">
  <div class="sky"></div>
  <canvas id="board" aria-label="Auto repair shop with scattered parts"></canvas>
  <div id="hit" aria-hidden="true"></div>
  <div class="progress" id="progress" aria-label="Progress"><div class="progress-track"><i id="progress-fill"></i></div><span id="progress-caption">0 / 6</span></div>
  <footer class="play-footer">
    <div class="tray-frame" id="tray-frame"><div id="tray" aria-label="Tray"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div></div>
  </footer>
  <canvas id="dock" aria-hidden="true"></canvas>
  <div id="combo" aria-live="polite"></div>
  <div id="tutorial" hidden aria-hidden="true"><div class="tut-hand"><svg viewBox="0 0 48 48"><path d="M15 25V8.6a3.5 3.5 0 0 1 7 0v11.2a2.7 2.7 0 0 1 5.3.8 2.6 2.6 0 0 1 5 1.3 2.5 2.5 0 0 1 4.7 2.7V32c0 5.5-3 9.5-8 10h-6.5c-2 0-3.5-.8-4.7-2.2L11 31.6c-1.2-1.5-.8-3.6.8-4.5 1.2-.7 2.5-.5 3.2.3Z" fill="#fff" stroke="#24407f" stroke-width="2.6" stroke-linejoin="round"/><path d="M22 20.6v2.2M27.3 21.5v2.1M32.3 22.9v1.9" fill="none" stroke="#24407f" stroke-width="2" stroke-linecap="round"/></svg></div><div class="tut-bubble">Collect 3 of the same part!</div></div>

  <section id="result" class="backdrop" hidden>
    <div class="card">
      <div class="rays"></div>
      <div class="result-badge" id="result-badge"></div>
      <div class="stars" id="stars">
        <svg viewBox="0 0 24 24"><path d="m12 2.6 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z"/></svg>
        <svg viewBox="0 0 24 24"><path d="m12 2.6 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z"/></svg>
        <svg viewBox="0 0 24 24"><path d="m12 2.6 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8Z"/></svg>
      </div>
      <h2 id="result-title">Master work!</h2>
      <p id="result-message">The shop is spotless, everything in its place.</p>
      <div class="stats" id="stats"></div>
      <button class="big-btn green" id="result-primary">Next level</button>
    </div>
  </section>



  <div id="loading"><div class="load-sign"><b>AUTO REPAIR</b><p id="loading-message">Opening the shop…</p><div class="load-bar"><i></i></div></div></div>
</main>
<!--APP-->
</body>
</html>
